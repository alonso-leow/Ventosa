<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>App</title>
<link rel="stylesheet" href="/common/ventosa.css">
<script src="/common/brand.js"></script>
<script src="/common/ventosa-app.js"></script>
<style>
  main { padding: 12px; display: grid; gap: 12px; max-width: 560px; margin: 0 auto; }
  label { display: grid; gap: 4px; }
  select, textarea { width: 100%; font-size: 16px; }
  textarea { min-height: 72px; }
  button.p { font-size: 16px; padding: 12px; }
  #result, #next { color: var(--dim); }
</style></head>
<body>
<header><h1 data-app="App"></h1></header>
<main>
  <p id="next"></p>
  <label>Subject <select id="subject"></select></label>
  <label>Note <textarea id="note" placeholder="Optional"></textarea></label>
  <button class="p" id="done">Done</button>
  <p id="result"></p>
</main>
<script>
(async () => {
  const subj = document.getElementById('subject');
  const result = document.getElementById('result');
  let app = {};
  try { app = await ventosa.app(); } catch {}
  if (app.title) document.title = app.title;
  document.getElementById('next').textContent = app.next || '';
  async function load() {
    const st = await ventosa.state();
    const all = Object.entries(st.videos || {});
    const want = app.node ? all.filter(([, v]) => v.stage === app.node) : all.filter(([, v]) => v.stage !== 'done');
    subj.innerHTML = '';
    for (const [id, v] of want) {
      const o = document.createElement('option');
      o.value = id; o.textContent = `${id} · ${v.title || ''}`;
      subj.append(o);
    }
    if (!want.length) result.textContent = 'Nothing waiting here.';
  }
  document.getElementById('done').addEventListener('click', async () => {
    if (!subj.value) return;
    try {
      const r = await ventosa.done(subj.value, document.getElementById('note').value);
      result.textContent = `${r.subject} is now at ${r.stage} (${r.owner}).`;
      await load();
    } catch (e) { result.textContent = 'Could not save: ' + e.message; }
  });
  await load();
})();
</script>
</body></html>
